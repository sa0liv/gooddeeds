services:
  - type: web
    name: gooddeeds-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gooddeeds-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

databases:
  - name: gooddeeds-db
    databaseName: gooddeeds
    user: gooddeeds_user
